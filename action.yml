name: golem-check
description: "Grade the AI coding agent files a repository carries (MCP servers, hooks, skills, instructions, permissions, secrets), offline."
branding:
  icon: shield
  color: gray-dark

inputs:
  path:
    description: "The repository to check."
    default: "."
  fail-on:
    description: "Fail the job when a finding is at least this severe: dangerous, suspicious or none."
    default: dangerous
  version:
    description: "The golem-check release to run, such as v0.2.0. By default, the release this action is pinned to, or the latest one."
    default: ""
  sarif:
    description: "Where to write the SARIF report."
    default: golem-check.sarif
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning. Needs `security-events: write`."
    default: "true"
  upload:
    description: "Also send the findings to the Golem console, from the default branch only. Needs `golem-token`. A failure prints one line and does not fail the job."
    default: "false"
  golem-token:
    description: "A CI token from the Golem console (IAM, AI agents, New CI token), kept as the secret `GOLEM_CHECK_TOKEN`. Used only with `upload`."
    default: ""
  golem-url:
    description: "Where `upload` sends the findings. By default Golem's hosted service, https://relay.golem.team."
    default: ""

outputs:
  grade:
    description: "The repository's grade, A to F, or empty when it has no agent files."
    value: ${{ steps.check.outputs.grade }}
  sarif:
    description: "The SARIF report's path."
    value: ${{ inputs.sarif }}

runs:
  using: composite
  steps:
    - name: Download golem-check
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS_NAME" in
          Linux) os=linux ext=tar.gz ;;
          macOS) os=darwin ext=tar.gz ;;
          Windows) os=windows ext=zip ;;
          *) echo "golem-check: no build for $RUNNER_OS_NAME" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH_NAME" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "golem-check: no build for $RUNNER_ARCH_NAME" >&2; exit 1 ;;
        esac
        if [ -z "$VERSION" ] && [[ "$ACTION_REF" == v* ]]; then VERSION="$ACTION_REF"; fi
        base=https://github.com/GolemTeam/golem-team-shield/releases/latest/download
        if [ -n "$VERSION" ]; then base="https://github.com/GolemTeam/golem-team-shield/releases/download/$VERSION"; fi
        asset="golem-team-shield_${os}_${arch}.${ext}"
        dir="$RUNNER_TEMP/golem-check"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/$asset" "$base/$asset"
        curl -fsSL --retry 3 -o "$dir/checksums.txt" "$base/checksums.txt"
        want=$(awk -v a="$asset" '$2 == a {print $1}' "$dir/checksums.txt")
        if command -v sha256sum >/dev/null; then got=$(sha256sum < "$dir/$asset" | cut -d' ' -f1); else got=$(shasum -a 256 < "$dir/$asset" | cut -d' ' -f1); fi
        if [ -z "$want" ] || [ "$want" != "$got" ]; then
          echo "golem-check: $asset does not match the release's checksums.txt" >&2
          exit 1
        fi
        if [ "$ext" = zip ]; then unzip -oq "$dir/$asset" golem-check.exe -d "$dir"; else tar -xzf "$dir/$asset" -C "$dir" golem-check; fi
        echo "$dir" >> "$GITHUB_PATH"

    - name: Check the repository
      id: check
      shell: bash
      env:
        CHECK_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        SARIF: ${{ inputs.sarif }}
      run: |
        set -uo pipefail
        golem-check -repo "$CHECK_PATH"
        golem-check -repo "$CHECK_PATH" -sarif -o "$SARIF" -fail-on "$FAIL_ON"
        code=$?
        grade=$(golem-check -repo "$CHECK_PATH" -json -with-score | sed -n 's/^    "grade": "\(.*\)",$/\1/p' | head -1)
        echo "grade=$grade" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

    - name: Upload to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.check.outcome == 'success' }}
      uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
      with:
        sarif_file: ${{ inputs.sarif }}
        category: golem-check

    - name: Send to Golem
      if: ${{ always() && inputs.upload == 'true' && steps.check.outcome == 'success' }}
      shell: bash
      env:
        CHECK_PATH: ${{ inputs.path }}
        TOKEN_INPUT: ${{ inputs.golem-token }}
        URL_INPUT: ${{ inputs.golem-url }}
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -uo pipefail
        if [[ "$EVENT_NAME" == pull_request* ]] || [ "$REF_TYPE" != branch ] || { [ -n "$DEFAULT_BRANCH" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; }; then
          echo "golem-check: not sent to Golem: only the default branch's findings are sent"
          exit 0
        fi
        if [ -n "$TOKEN_INPUT" ]; then export GOLEM_CHECK_TOKEN="$TOKEN_INPUT"; fi
        if [ -n "$URL_INPUT" ]; then export GOLEM_URL="$URL_INPUT"; fi
        golem-check -repo "$CHECK_PATH" -json -o "$RUNNER_TEMP/golem-check-upload.json" -upload || true

    - name: Fail on findings
      if: ${{ steps.check.outputs.code == '3' }}
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "golem-check: a finding is at least $FAIL_ON" >&2
        exit 1
