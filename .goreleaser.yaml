# Release builds for golem-exec and golem-check. Push a tag (v0.1.0) and the
# release workflow publishes archives for macOS, Linux and Windows with a
# checksums file. Check locally with `goreleaser release --snapshot --clean`.
version: 2

project_name: golem-team-shield

builds:
  - id: golem-exec
    main: ./cmd/golem-exec
    binary: golem-exec
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
  - id: golem-check
    main: ./cmd/golem-check
    binary: golem-check
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - id: shield
    ids: [golem-exec, golem-check]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, man/*.1]

checksum:
  name_template: checksums.txt

# The cask in GolemTeam/homebrew-golem-team, so
# `brew install golemteam/golem-team/golem-team-shield` works. The release
# workflow mints GORELEASER_TAP_TOKEN from the golem-team-release GitHub App,
# installed on that repo only; without the App the cask is skipped and the
# release still publishes.
homebrew_casks:
  - name: golem-team-shield
    ids: [shield]
    repository:
      owner: GolemTeam
      name: homebrew-golem-team
      token: "{{ .Env.GORELEASER_TAP_TOKEN }}"
    skip_upload: '{{ if index .Env "GORELEASER_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    commit_author:
      name: donlem
      email: 274921758+donlem@users.noreply.github.com
    commit_msg_template: "golem-team-shield {{ .Tag }}"
    homepage: https://github.com/GolemTeam/golem-team-shield
    description: Kernel jail for AI coding agents' shell commands, and a check of their settings
    license: Apache-2.0
    binaries: [golem-exec, golem-check]
    manpages: [man/golem-exec.1, man/golem-check.1]
    caveats: |
      Run `golem-exec install` to jail every shell command Claude Code runs,
      then restart Claude Code. `golem-check` lists risky agent settings.
    # The binaries are not notarized yet, so Gatekeeper would refuse them.
    # Claude Code runs the copy `golem-exec install` put in ~/.golem/bin, so an
    # upgrade refreshes that copy too; it does nothing if none is installed.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/golem-exec", "{{ .StagedPath }}/golem-check"]
          end
          run "{{ .StagedPath }}/golem-exec", args: ["install", "--refresh"]

changelog:
  use: github
