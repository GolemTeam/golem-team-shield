name: test
on: [push, pull_request]
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
  # Ubuntu's default since 23.10: AppArmor keeps user namespaces from
  # programs it doesn't name. Without golem-exec's profile an allowlisted
  # shell is held by Landlock's port rule; with it, by its own namespace, and
  # the command still can't make one with capabilities or trace the launcher.
  linux-restricted-userns:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cmd/golem-exec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
      - run: go test -c -o $RUNNER_TEMP/golem-exec.test .
      - name: without the profile
        run: $RUNNER_TEMP/golem-exec.test -test.v -test.run TestLinux
      - name: install the profile
        run: sudo GOLEM_EXEC_APPARMOR=install $RUNNER_TEMP/golem-exec.test -test.v -test.run TestLinuxAppArmorProfile
      - name: with the profile
        run: GOLEM_EXEC_EXPECT_NAMESPACE=1 $RUNNER_TEMP/golem-exec.test -test.v -test.run TestLinux
      - name: remove the profile
        run: sudo GOLEM_EXEC_APPARMOR=remove $RUNNER_TEMP/golem-exec.test -test.v -test.run TestLinuxAppArmorProfile
      - name: the real binary
        run: |
          bin=$RUNNER_TEMP/bin && mkdir -p $bin ~/.golem
          go build -o $bin/golem-exec . && ln -s golem-exec $bin/golem-bash
          printf '{"network":"allowlist","allowed_hosts":["github.com"]}' > ~/.golem/shield.json
          $bin/golem-exec status | grep -q 'sudo .* apparmor install'
          sudo $bin/golem-exec apparmor install
          go build -ldflags "-X main.version=later" -o $bin/golem-exec .
          $bin/golem-exec status | grep -q "held by a network namespace, which golem-exec's AppArmor profile"
          $bin/golem-exec status | grep -q "settings in the work tree are held read-only"
          outside=$(readlink /proc/self/ns/net)
          inside=$($bin/golem-bash -c 'tr "\0" " " < /proc/$PPID/cmdline; readlink /proc/self/ns/net')
          echo "$inside"
          case "$inside" in golem-shield-userns*) ;; *) echo "not started by the launcher"; exit 1 ;; esac
          [ "${inside##* }" != "$outside" ] || { echo "same network namespace"; exit 1; }
          if /usr/local/libexec/golem-exec/golem-exec status; then echo "the copy ran as the CLI"; exit 1; fi
          if (exec -a golem-shield-jail /usr/local/libexec/golem-exec/golem-exec /bin/true); then echo "the copy ran as the stage"; exit 1; fi
          sudo $bin/golem-exec apparmor remove
          [ ! -e /usr/local/libexec/golem-exec ] && [ ! -e /etc/apparmor.d/golem-exec ]
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
